# Shared model + solver settings. Geometry files and experiments override parts of this.
grid_step: 0.2            # MFG grid [m]
dt_exec: 0.01             # control / simulation step [s]
horizon: path             # horizon from the path length to the goal
matmul_precision: highest # always: default precision once produced a spurious 2x effect
scenario:
  w_goal: 2.0             # goal-progress weight (conical)
  w_hold: 8.0             # penalty for being outside the goal disc
  goal_softness: 0.25
  obs_penalty: 200.0      # soft macro wall
  wall_thickness: 0.3
  edge_softness: 0.25
  goal_core_frac: 0.75    # flat core: no goal pull inside 0.75 r_goal, only congestion. crowding_stale (2026-11-17,
                          # T_frame 200 ms): ever_collided N=50 0.44 -> 0.18, in-disc contacts N=100 -78% vs the plain
                          # cone; transit contacts unchanged; arrival +1.7 s median at N=100. Enters the MFG cache key.
macro_cost:
  c_w: 1.0                # congestion W(m) = c_w m^2
  w_bar: 10.0             # soft collision barrier
  m_bar: 6.25             # 1 / R_BARRIER^2 [agents/m^2]
  f_cap: 300.0            # solver safeguard
fp:                       # fictitious play
  damping: 0.02
  max_iters: 800
  burn_in: 200
  tol: 0.005
  nu: 0.5                 # viscosity [m^2/s] of the planner's MFG (agents get no noise). Phase 0 (2026-11-17):
                          # nu=0.5 is the only tested value with a true fixed point (TV 0.001, iterate converges);
                          # nu=0 cycles (TV 0.95), 0.05 (0.82), 0.2 (0.10). Enters the MFG cache key.
control:
  c_dens: 1.0             # weight of the local density-tracking term
  hold_on_arrival: false  # off: hold stops arrivals at the disc edge and blocks the rest (crowding_test, N=100: arrival
                          # median 22.4 s with hold vs 14-15.5 s without). Option kept (+ hold_radius_frac). Not in the cache key.
  arrived_c_dens_boost: 2.0  # inside r_goal: c_dens *= (1+boost) so arrived agents spread; inbound unchanged.
                             # Not in the MFG cache key. Set 0 to disable. See configs/exp/goal_clear.yaml.
cbf:
  d_safe: 0.7             # = D_COLLISION 0.30 + 0.40 margin (operating margin)
  r_wall: 0.2             # wall half-thickness 0.05 + drone radius 0.15
  r_body: 0.15
  gamma: 20.0
  rho: 1.0
  slack_lin: 100.0
  k_nb: 8                 # neighbours per QP
  r_sense: 5.0
  prio_gain: 2.0
  prio_min: 0.25
  u_box: 5.656854249492381  # V_MAX / sqrt(2)
  tol: 1.0e-05
  maxiter: 2000
  qp_solver: exact_hard
  arrival_yield: true     # arrived (in disc) yield CBF share to inbound; uses scenario r_goal. Not in cache key.

